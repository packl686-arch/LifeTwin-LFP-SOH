name: public-release-ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: >-
          python -m pip install
          -c requirements/reproduction.txt
          -e ".[dev,showcase]"
      - name: Lint release, audit, and reproduction paths
        run: ruff check src scripts showcase tests

  reproduce:
    name: reproduce (${{ matrix.os }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install clean environment
        run: >-
          python -m pip install
          -c requirements/reproduction.txt
          -e ".[dev,showcase]"
      - name: Full release reproduction
        run: >-
          python scripts/reproduce_public_release.py
          --mode full
          --output artifacts/reproduction
          --retain-failed-staging
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reproduction-${{ matrix.os }}
          path: |
            artifacts/reproduction
            artifacts/.reproduction.staging-*
          include-hidden-files: true
          if-no-files-found: error
