name: public-release-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint public core
        run: >-
          ruff check
          src/lifetwin/models/calendar_v2.py
          src/lifetwin/models/calendar_v3_activation.py
          src/lifetwin/experiments/calendar_v3_activation_development.py
          showcase/analyze_phase8_results.py
          tests/test_public_release.py
      - name: Run reproducibility tests
        run: pytest -q tests/test_public_release.py
